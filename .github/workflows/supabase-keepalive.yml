name: Supabase keep-alive

# Supabase pauses free projects after a week without activity. One read a day
# keeps the accounts database awake. Does nothing until SUPABASE_URL is set.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.SUPABASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Read one profile
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1"
